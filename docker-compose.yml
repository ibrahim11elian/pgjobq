services:
  postgres:
    image: postgres:18.6-alpine
    container_name: pgjobq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pgjobq
      POSTGRES_PASSWORD: pgjobq_dev_only
      POSTGRES_DB: pgjobq
      # Deterministic timestamps in logs and tests. Schedules carry their own
      # IANA timezone, so the server timezone must never affect cron evaluation.
      TZ: UTC
      PGTZ: UTC
    ports:
      # Host 5433, not 5432. A native PostgreSQL install commonly already holds
      # 5432; on Windows both can bind it and the native service wins for
      # localhost, producing a confusing "password authentication failed" against
      # a completely different server. 5433 sidesteps that without touching an
      # existing local install. Container-internal port is unchanged.
      - '5433:5432'
    volumes:
      # Postgres 18+ requires the mount at /var/lib/postgresql, NOT the older
      # /var/lib/postgresql/data. The image stores data in a major-version
      # subdirectory so that pg_upgrade --link works without crossing a mount
      # boundary. Mounting the old path makes the container refuse to start.
      - pgjobq-data:/var/lib/postgresql
    command:
      - postgres
      # Headroom for the pool-sizing relationship documented in docs/deployment.md:
      #   api_instances x api_pool + worker_instances x (worker_pool + 1 listener + 1 background)
      - -c
      - max_connections=200
      # Surface slow statements during local benchmarking. The claim statement
      # should never appear here; if it does, check the partial index is in use.
      - -c
      - log_min_duration_statement=200
      - -c
      - log_lock_waits=on
      # Wait events for the MultiXact contention analysis in design.md section 10.3.
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pgjobq -d pgjobq']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  pgjobq-data:
    name: pgjobq-data
