name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same ref; no point paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only credential. Never used outside this ephemeral service container.
  DATABASE_URL: postgres://pgjobq:pgjobq_ci@localhost:5432/pgjobq

jobs:
  static:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --build
      - run: npm run lint
      - run: npm run format:check
      # The generated state-machine doc must match the transition table. If this diff is
      # non-empty someone edited the table without regenerating, and the published diagram
      # is now lying about the implementation.
      - name: Verify generated docs are current
        run: |
          npm run gen:docs
          git diff --exit-code docs/state-machine.md

  verify:
    name: Verify — Postgres ${{ matrix.postgres }}, Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range. Testing only the newest would let a
        # dependency on a feature added after 14 slip through unnoticed.
        postgres: ['14', '18']
        node: ['22']
        include:
          - postgres: '18'
            node: '24'
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: pgjobq
          POSTGRES_PASSWORD: pgjobq_ci
          POSTGRES_DB: pgjobq
          TZ: UTC
          PGTZ: UTC
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pgjobq -d pgjobq"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --build

      - name: Apply migrations
        run: npm run migrate:up

      - name: Engine smoke checks
        run: npm run smoke

      - name: Start API
        # `&` backgrounds the server, and because there is no `exit` here the process
        # survives into the following steps. An earlier version ran `exit 0` once the
        # health check passed, which ended this step's shell and took the backgrounded
        # server down with it -- so the smoke step hit either a dead port or a fresh
        # process whose bootstrap key was not yet registered.
        #
        # `nohup` + full output redirect detaches it from this step's stdio so the runner
        # does not block waiting for the stream to close.
        run: |
          nohup node packages/server/dist/main.js > api.log 2>&1 &
          echo $! > api.pid
        env:
          PORT: '3001'
          # MUST start with `pgjq_`: Authenticator.authenticate() rejects anything without
          # that prefix before it ever compares hashes, so a key lacking it 401s every
          # authenticated request while /health and /ready still pass.
          API_BOOTSTRAP_KEY: pgjq_ciRunnerKey0123456789abcdefghijklmn
          NODE_ENV: test

      - name: Wait for the API to be ready
        # /ready verifies the database is reachable AND migrations are current, unlike
        # /health which only reflects process liveness. Waiting on /ready guarantees the
        # bootstrap key has been written before the smoke test authenticates -- the key is
        # registered during startup, after the port opens, so gating on /health alone let
        # the test fire authenticated requests against a server with no key yet.
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/ready > /dev/null 2>&1; then
              echo "api ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "api did not become ready; server log:"
          cat api.log || true
          exit 1

      - name: API smoke checks
        run: npm run api:smoke
        env:
          SMOKE_BASE: http://localhost:3001
          # Must match API_BOOTSTRAP_KEY above exactly.
          SMOKE_KEY: pgjq_ciRunnerKey0123456789abcdefghijklmn

      - name: Server log on failure
        if: failure()
        run: cat api.log || true

      - name: Stop API
        if: always()
        run: kill "$(cat api.pid)" 2>/dev/null || true

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --build
      - run: npx tsc -p packages/dashboard --noEmit
      - run: npm run build --workspace @pgjobq/dashboard

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pgjobq:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fails the build on a high or critical vulnerability. Scanning the built image
      # rather than the lockfile catches base-image CVEs too.
      #
      # Run from Trivy's own pinned image rather than via aquasecurity/trivy-action. In
      # March 2026 that action's tags were force-pushed to credential-stealing malware
      # (GHSA-69fq-xp46-6x23); 76 of 77 version tags were affected and later removed,
      # which is why previously-valid tags no longer resolve. Invoking a pinned image
      # directly removes the mutable-tag dependency from the supply chain.
      #
      # Cache the vulnerability DB across runs so this does not re-download ~50MB each time.
      - name: Cache Trivy database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Scan image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.71.2 image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress \
              pgjobq:ci

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Production dependencies only: a dev-tool advisory should not block a release.
      - run: npm audit --omit=dev --audit-level=high
